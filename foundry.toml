[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
remappings = [
    "reactive-lib/=lib/reactive-lib-omni/src/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
reactive_lasna = "https://lasna-rpc.rnk.dev/"
